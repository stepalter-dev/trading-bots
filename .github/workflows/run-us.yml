name: run-us

on:
  schedule:
    - cron: "10 13-20 * * 1-5"  # hourly at :10, 13-20 UTC; the bot itself only acts at 10am/12pm/2pm/3pm New York time (covers both EST and EDT)
  workflow_dispatch:
    inputs:
      force:
        description: "Force a real session now (ignore slot / market-open / duplicate gates)"
        type: boolean
        default: false

# One bot run at a time so they never fight over the data commit.
concurrency:
  group: bots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BOT_MODEL: ${{ vars.BOT_MODEL }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python -m bot.run us --force; else python -m bot.run us; fi
      - name: Save data
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "us: session $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
