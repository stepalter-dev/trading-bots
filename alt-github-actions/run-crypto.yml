name: run-crypto

on:
  schedule:
    - cron: "10 2,8,14,20 * * *"  # every day at 02:10, 08:10, 14:10, 20:10 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force a real session now (ignore slot / market-open / duplicate gates)"
        type: boolean
        default: false

# One bot run at a time so they never fight over the data commit.
concurrency:
  group: bots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BOT_MODEL: ${{ vars.BOT_MODEL }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python -m bot.run crypto --force; else python -m bot.run crypto; fi
      - name: Save data
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "crypto: session $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
